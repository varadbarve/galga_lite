name: Build web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["main.py", "assets/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build with pygbag
        run: |
          pip install --upgrade pygbag
          mkdir -p /tmp/galga_lite
          cp main.py /tmp/galga_lite/
          cp -r assets /tmp/galga_lite/
          cd /tmp/galga_lite
          python -m pygbag --build .
          cd "$GITHUB_WORKSPACE"
          rm -rf web-dist
          cp -r /tmp/galga_lite/build/web web-dist
      - name: Fit canvas to screen
        run: |
          python3 - <<'PYEOF'
          p = "web-dist/index.html"
          s = open(p, encoding="utf-8").read()
          snippet = """
          <style>
          html, body { margin: 0 !important; height: 100% !important; overflow: hidden !important;
            background: #02061a !important; touch-action: none; overscroll-behavior: none; }
          </style>
          <script>
          (function () {
            var W = 540, H = 820;
            function fit() {
              var c = document.getElementById("canvas");
              if (!c) return;
              var vw = window.innerWidth, vh = window.innerHeight;
              var s = Math.min(vw / W, vh / H);
              var w = Math.floor(W * s), h = Math.floor(H * s);
              var st = c.style;
              st.setProperty("position", "fixed", "important");
              st.setProperty("width", w + "px", "important");
              st.setProperty("height", h + "px", "important");
              st.setProperty("left", Math.floor((vw - w) / 2) + "px", "important");
              st.setProperty("top", Math.floor((vh - h) / 2) + "px", "important");
              st.setProperty("right", "auto", "important");
              st.setProperty("bottom", "auto", "important");
              st.setProperty("margin", "0", "important");
            }
            window.addEventListener("resize", fit);
            window.addEventListener("orientationchange", fit);
            setInterval(fit, 300);
          })();
          </script>
          """
          assert "</body>" in s
          if "function fit()" not in s:
              s = s.replace("</body>", snippet + "</body>")
          open(p, "w", encoding="utf-8").write(s)
          print("injected")
          PYEOF
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A web-dist
          git commit -m "Rebuild web-dist" || echo "No changes"
          git push
