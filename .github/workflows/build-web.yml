name: Build web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["main.py", "assets/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install --upgrade pygbag
          mkdir -p /tmp/galga_lite
          cp main.py /tmp/galga_lite/
          cp -r assets /tmp/galga_lite/
          cd /tmp/galga_lite
          python -m pygbag --build .
          cd "$GITHUB_WORKSPACE"
          rm -rf web-dist
          cp -r /tmp/galga_lite/build/web web-dist
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A web-dist
          git commit -m "Rebuild web-dist" || echo "No changes"
          git push
